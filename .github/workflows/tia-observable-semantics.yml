name: TIA Observable Semantics Proof

on:
  pull_request:

permissions:
  contents: read

jobs:
  counterexamples:
    if: startsWith(github.head_ref, 'fix/tia-observable-content-hash-')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: none
          extensions: sockets
      - name: Install
        env:
          COMPOSER_ROOT_VERSION: 5.x-dev
        run: composer update --prefer-stable --no-interaction --no-progress
      - name: Prove cache never suppresses observably different content
        shell: bash
        env:
          COMPOSER_ROOT_VERSION: 5.x-dev
          XDEBUG_MODE: off
          PAO_DISABLE: '1'
          COLLISION_PRINTER: DefaultPrinter
          COLLISION_IGNORE_DURATION: 'true'
        run: |
          php bin/pest tests/Unit/Plugins/Tia/ContentHash.php --filter='observable' --colors=never
