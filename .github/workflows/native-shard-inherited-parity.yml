name: Native Shard Inherited Method Parity

on:
  pull_request:

permissions:
  contents: read

jobs:
  inherited_phpunit_test:
    if: startsWith(github.head_ref, 'experiment/native-paratest-suite-dispatch-') || startsWith(github.head_ref, 'candidate/pest-5-safe-fast-')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: none
          extensions: sockets
      - name: Install
        env:
          COMPOSER_ROOT_VERSION: 5.x-dev
        run: composer update --prefer-stable --no-interaction --no-progress
      - name: Two classes must execute the one inherited method
        shell: bash
        env:
          COMPOSER_ROOT_VERSION: 5.x-dev
          XDEBUG_MODE: off
          PAO_DISABLE: '1'
          COLLISION_PRINTER: DefaultPrinter
          COLLISION_IGNORE_DURATION: 'true'
        run: |
          set -euo pipefail
          args=(bin/pest --configuration=tests/Fixtures/Suites/NativeShardInherited.xml --parallel --processes=2 --colors=never)
          env -u PEST_SHARD_NATIVE php "${args[@]}" --shard=1/1 > /tmp/inherited-legacy.log 2>&1 || { cat /tmp/inherited-legacy.log; exit 1; }
          grep -q '2 passed' /tmp/inherited-legacy.log || { cat /tmp/inherited-legacy.log; exit 1; }
          if ! env PEST_SHARD_NATIVE=1 php "${args[@]}" --shard=1/1 > /tmp/inherited-native.log 2>&1; then
            echo "::error::Inherited test method mapped to declaring file instead of child class file"
            cat /tmp/inherited-native.log
            exit 1
          fi
          grep -q '2 passed' /tmp/inherited-native.log || { cat /tmp/inherited-native.log; exit 1; }
          echo 'INHERITED_METHOD_FILE_ALLOCATION=PASS'
