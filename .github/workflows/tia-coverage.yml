name: TIA Real Coverage Regressions

on:
  pull_request:
    paths:
      - 'src/Plugins/Tia/CoverageMerger.php'
      - 'tests/Features/Tia/DeletedTestCoverage.php'
      - '.github/workflows/tia-coverage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tia-real-coverage:
    name: Real coverage / ${{ matrix.driver }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        driver: [xdebug, pcov]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP with coverage driver
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: ${{ matrix.driver }}
          extensions: sockets

      - name: Install dependencies
        env:
          COMPOSER_ROOT_VERSION: 5.x-dev
        run: composer update --prefer-stable --no-interaction --no-progress --ansi --with="symfony/console:^8.0"

      - name: Verify coverage driver
        run: |
          if [ '${{ matrix.driver }}' = 'pcov' ]; then
            php -r 'exit(extension_loaded("pcov") && ini_get("pcov.enabled") ? 0 : 1);'
          else
            XDEBUG_MODE=coverage php -r 'exit(extension_loaded("xdebug") && in_array("coverage", xdebug_info("mode"), true) ? 0 : 1);'
          fi

      - name: Test cached coverage reconciliation, sequential and parallel
        run: XDEBUG_MODE=coverage php bin/pest tests/Features/Tia/DeletedTestCoverage.php -v
