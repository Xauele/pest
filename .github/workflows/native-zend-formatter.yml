name: Native Zend Formatter Patch

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnostic:
    if: startsWith(github.head_ref, 'experiment/zend-native-tia-observer-')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: none
      - name: Install
        env:
          COMPOSER_ROOT_VERSION: 5.x-dev
        run: composer update --prefer-stable --no-interaction --no-progress
      - name: Pint formatter exact changes
        shell: bash
        run: |
          vendor/bin/pint extensions/pest_observer/tests/benchmark.php extensions/pest_observer/tests/proof.php
          git diff --no-ext-diff -- extensions/pest_observer/tests/benchmark.php extensions/pest_observer/tests/proof.php
